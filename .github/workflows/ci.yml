name: CI

# Cost rules (owner, 2026-11-05: Actions usage hit 90% of the allowance). macOS bills 10x and Windows 2x, so this
# fork runs ONE Ubuntu job on pushes to main only (never PRs or other branches). The upstream macOS native build,
# the Swift policy suites and the Windows build/smoke jobs were removed: they were the expensive part of every push.
# Native changes are verified on a real Mac before merging (see the PR notes); the Dart side is checked here.
on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "*.md"
      - "**/*.md"

concurrency:
  group: ci-main
  cancel-in-progress: true

jobs:
  analyze-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: No audit tags or line citations in comments
        run: tool/check_comment_tags.sh
      - uses: subosito/flutter-action@v2
        with:
          # Pinned to the Flutter version the consumer ships against, not floating `stable`.
          flutter-version: 3.38.8
          channel: stable
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Analyze (package, sub-packages, example)
        run: |
          flutter analyze
          (cd packages/flutter_cef_platform_interface && flutter pub get && flutter analyze)
          (cd packages/flutter_cef_macos && flutter pub get && flutter analyze)
          (cd packages/flutter_cef_windows && flutter pub get && flutter analyze)
          (cd example && flutter pub get && flutter analyze)
      - name: Test
        run: flutter test
